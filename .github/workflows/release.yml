name: Release

# Publishes to PyPI when a v* tag is pushed. Uses PyPI Trusted Publishing (OIDC),
# so there is no API token stored in this repo.
#
# One-time setup on PyPI: Project -> Publishing -> add a GitHub publisher with
#   owner: cfdude   repository: nfsn-cli   workflow: release.yml   environment: pypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

      - name: Tag must match the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PROJECT="$(uv run python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$TAG" != "$PROJECT" ]; then
            echo "Tag $TAG does not match pyproject version $PROJECT" >&2
            exit 1
          fi
          echo "Tag and project version agree: $PROJECT"

  publish:
    name: Publish to PyPI
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uv run --with twine twine check dist/*

      # A version can already be on PyPI when it was published by hand, as 0.1.0 was.
      # PyPI refuses to overwrite a released file, so publishing again is a hard error
      # rather than a no-op. Check first and skip, so re-tagging is not destructive and
      # the run stays green.
      - name: Is this version already on PyPI?
        id: released
        run: |
          VERSION="$(uv run python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if curl -sfo /dev/null "https://pypi.org/pypi/nfsn-cli/${VERSION}/json"; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "nfsn-cli ${VERSION} is already on PyPI; skipping upload."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "nfsn-cli ${VERSION} is not on PyPI; will upload."
          fi

      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.released.outputs.already == 'false'
