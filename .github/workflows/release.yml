name: Release

# Publishes to PyPI when a v* tag is pushed. Uses PyPI Trusted Publishing (OIDC),
# so there is no API token stored in this repo.
#
# One-time setup on PyPI: Project -> Publishing -> add a GitHub publisher with
#   owner: cfdude   repository: nfsn-cli   workflow: release.yml   environment: pypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

      - name: Tag must match the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PROJECT="$(uv run python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$TAG" != "$PROJECT" ]; then
            echo "Tag $TAG does not match pyproject version $PROJECT" >&2
            exit 1
          fi
          echo "Tag and project version agree: $PROJECT"

  publish:
    name: Publish to PyPI
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uv run --with twine twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
