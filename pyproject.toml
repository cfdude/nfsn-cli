[project]
name = "nfsn-cli"
version = "0.1.1"
description = "A modern command line interface and Python client for the NearlyFreeSpeech.NET API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rob Sherman", email = "cfdude@users.noreply.github.com" }]
keywords = ["nearlyfreespeech", "nfsn", "dns", "cli", "hosting", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/cfdude/nfsn-cli"
Repository = "https://github.com/cfdude/nfsn-cli"
Issues = "https://github.com/cfdude/nfsn-cli/issues"

[project.scripts]
nfsn = "nfsn_cli.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    # ruff is the linter AND the formatter. Declared here so CI and fresh clones get it
    # rather than depending on it happening to be on PATH.
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nfsn_cli"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
